<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Rental Manager | Warehouse & Rental System</title>
  <!-- Bootstrap 5 CDN -->
  <link href="libs/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="libs/bootstrap-icons/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-bg">

  <div class="login-card">
    <div class="login-header">
      <div class="brand-logo-icon">
        <i class="bi bi-box-seam-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Rental Manager</h3>
      <p class="text-white-50 mb-0 small">Warehouse & Rental Bill Management System</p>
    </div>

    <div class="login-body">
      <!-- Error Message Box -->
      <div id="login-error-alert" class="alert alert-danger d-none align-items-center gap-2 py-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill fs-5"></i>
        <div id="login-error-text" class="small">Invalid username or password.</div>
      </div>

      <form id="login-form">
        <div class="mb-3">
          <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-person-fill"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Enter username" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Enter password" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" title="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="form-text small text-muted mt-1">
            <i class="bi bi-info-circle me-1"></i>System login: <strong>admin</strong> / <strong>admin123</strong> (or click <span class="text-primary fw-semibold">Fill Demo</span>)
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
          </div>
          <span class="badge bg-light text-primary border small py-1 px-2 cursor-pointer" id="fillDemoBtn" style="cursor: pointer;">
            <i class="bi bi-key-fill me-1"></i>Fill Demo
          </span>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex justify-content-center align-items-center gap-2" id="submitBtn" style="background-color: #0f3460; border-color: #0f3460;">
          <span id="btnText">Sign In to Dashboard</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center text-muted small">
        <i class="bi bi-shield-check text-success me-1"></i> Secure Role-Based Management System
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container position-fixed top-0 end-0 p-3"></div>

  <!-- Bootstrap 5 Bundle JS CDN -->
  <script src="libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Toggle Password Visibility
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePasswordBtn.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });

    // Fill Demo Credentials Helper
    document.getElementById('fillDemoBtn').addEventListener('click', () => {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
      showToast('Demo credentials filled: admin / admin123', 'info');
    });

    // Handle Login Form Submission
    const loginForm = document.getElementById('login-form');
    const errorAlert = document.getElementById('login-error-alert');
    const errorText = document.getElementById('login-error-text');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('d-none');
      errorAlert.classList.remove('d-flex');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorText.textContent = 'Please provide both username and password.';
        errorAlert.classList.remove('d-none');
        errorAlert.classList.add('d-flex');
        return;
      }

      // Show loading indicator
      submitBtn.disabled = true;
      btnText.textContent = 'Authenticating...';
      btnSpinner.classList.remove('d-none');

      try {
        const response = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Login failed. Please check your credentials.');
        }

        // Store JWT token and user info
        localStorage.setItem('rental_token', data.token);
        localStorage.setItem('rental_user', JSON.stringify(data.user));

        showToast('Login successful! Redirecting...', 'success');

        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);

      } catch (err) {
        console.error('Login error:', err);
        errorText.textContent = err.message || 'Login failed. Please verify credentials.';
        errorAlert.classList.remove('d-none');
        errorAlert.classList.add('d-flex');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In to Dashboard';
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
